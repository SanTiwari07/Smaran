# Qdrant Server for the fleet (cloud) side. Devices never talk to it directly; the gateway does.
#   docker compose -f infra/docker-compose.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: smaran-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
