# Qdrant Server for the fleet (cloud) side. Devices never talk to it directly; the gateway does.
#   docker compose -f infra/docker-compose.yml up -d
# The image tag matches the pinned qdrant-client in backend/requirements.txt (1.19.1).
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: smaran-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped

# Fresh volumes for 1.19: the old 1.15 volume (qdrant_data) held demo data only, and Qdrant
# does not support skipping minor versions when upgrading storage.
volumes:
  qdrant_storage:
  qdrant_snapshots:
